<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Class - Classroom Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        :root { --soft-pink: #FFC1CC; --sky-blue: #B3E5FC; --mint: #C8E6C9; --text: #5d4037; --bg: #FFFDE7; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #f0f0f0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 414px; height: 100vh; background: var(--bg); position: relative; border-radius: 30px; overflow: hidden; border: 8px solid white; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .page { display: none; flex-direction: column; height: 100%; padding: 18px; overflow-y: auto; padding-bottom: 110px; }
        .page.active { display: flex; }
        .card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.03); margin-bottom: 12px; position: relative; text-align: center; }
        .news-bar { background: #fff9c4; border-left: 5px solid #fbc02d; padding: 10px; border-radius: 12px; font-size: 13px; margin-bottom: 12px; text-align: left; }
        .av-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 15px 0; }
        .av-item { border-radius: 12px; border: 2px solid transparent; cursor: pointer; transition: 0.2s; background: white; padding: 5px; }
        .av-item.selected { border-color: var(--soft-pink); background: #fff0f3; transform: scale(1.1); }
        .vocab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .vocab-card { background: white; border: 2px solid #f0f0f0; border-radius: 15px; padding: 15px; text-align: center; }
        .btn-skill { border: none; padding: 16px; border-radius: 18px; color: white; font-weight: 600; cursor: pointer; width: 100%; }
        .nav-bar { background: white; display: grid; grid-template-columns: repeat(3, 1fr); padding: 12px 0 32px; position: absolute; bottom: 0; width: 100%; border-top: 1px solid #f0f0f0; }
        .nav-item { text-align: center; color: #ccc; cursor: pointer; font-size: 11px; }
        .nav-item.active { color: var(--soft-pink); font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 8px; outline: none; font-size: 16px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 2000; flex-direction: column; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="page-login" class="page active">
        <h2 style="text-align: center; color: var(--soft-pink);">关老师 ห้องเรียนจีน 🐼</h2>
        <div class="card">
            <input type="text" id="u-name" placeholder="ชื่อเล่นของหนู...">
            <p style="font-size: 12px; text-align: left; margin: 5px 0;">เลือกห้องเรียนของหนู:</p>
            <select id="u-class-select"><option value="">กำลังโหลดห้องเรียน...</option></select>
            
            <p style="font-size: 11px; color: #999; margin-top: 10px;">เลือก "คู่หู" 10 แบบ:</p>
            <div class="av-grid" id="login-av-grid"></div>
            <button class="btn-skill" style="background:var(--soft-pink);" onclick="login()">เข้าเรียนจ๊ะ ➔</button>
        </div>
    </div>

    <div id="page-home" class="page">
        <div id="news-bar" class="news-bar" style="display:none;">📢 <span id="news-txt"></span></div>
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:10px;">
            <span>💎 <b><span id="score">0</span></b></span>
            <span id="room-tag" style="background:var(--sky-blue); padding:2px 10px; border-radius:10px; font-size:11px; font-weight:bold;">...</span>
        </div>
        <div class="card">
            <img id="pet-img" src="" style="height:80px;">
            <div id="pet-status" style="font-size:11px; font-weight:bold; color:var(--soft-pink);">ร่างไข่</div>
            <hr style="border:0; border-top:1px solid #f9f9f9; margin:10px 0;">
            <div id="main-cat" style="font-size:11px; color:var(--soft-pink); font-weight:bold;">หมวดหมู่</div>
            <div id="main-word" style="font-size:45px; font-weight:bold; color:var(--text);">...</div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn-skill" onclick="goLink('read')" style="background:var(--sky-blue);">📖 อ่าน</button>
            <button class="btn-skill" onclick="goLink('listen')" style="background:var(--mint);">🎧 ฟัง</button>
            <button class="btn-skill" onclick="goLink('speak')" style="background:#fff176; color:#5d4037;">🗣️ พูด</button>
            <button class="btn-skill" onclick="goLink('write')" style="background:var(--soft-pink);">✍️ เขียน</button>
        </div>
    </div>

    <div id="page-vocab" class="page">
        <h3 style="text-align: center; color:var(--soft-pink);">📚 คลังคำศัพท์</h3>
        <div id="vocab-list"></div>
    </div>

    <div id="page-board" class="page">
        <h3 style="text-align: center; color:var(--soft-pink);">🏆 อันดับห้อง <span id="board-title"></span></h3>
        <div id="leaderboard"></div>
    </div>

    <div id="page-admin" class="page">
        <h3>⚙️ ตั้งค่าห้องเรียน</h3>
        <div class="card" style="text-align:left; font-size:13px;">
            <b>1. จัดการห้องเรียน (ใส่ชื่อห้องคั่นด้วยลูกน้ำ ,)</b>
            <input type="text" id="adm-rooms" placeholder="เช่น ห้อง A, ห้อง B, ห้อง C">
            <hr>
            <b>2. อัปเดตบทเรียนปัจจุบัน</b>
            <input type="text" id="adm-news" placeholder="ประกาศ">
            <input type="text" id="adm-cat" placeholder="หมวดหมู่">
            <input type="text" id="adm-word" placeholder="ตัวจีน">
            <hr>
            <b>3. ลิงก์แบบฝึกหัด</b>
            <input type="text" id="l-r" placeholder="ลิงก์อ่าน">
            <input type="text" id="l-l" placeholder="ลิงก์ฟัง">
            <button class="btn-skill" style="background:var(--mint);" onclick="saveAdmin()">บันทึกข้อมูลทั้งหมด ➔</button>
        </div>
        <button class="btn-skill" style="background:#999;" onclick="nav('page-home')">กลับ</button>
    </div>

    <div id="nav-bar" class="nav-bar" style="display:none;">
        <div class="nav-item active" onclick="nav('page-home', this)">🏠 เรียน</div>
        <div class="nav-item" onclick="nav('page-vocab', this)">📚 ศัพท์</div>
        <div class="nav-item" onclick="nav('page-board', this)">🏆 อันดับ</div>
    </div>

    <div id="web-overlay" class="overlay">
        <div style="padding:10px; background:#f9f9f9; display:flex; justify-content:space-between; align-items:center;">
            <b>ฝึกทักษะ</b>
            <button onclick="closeWeb()" style="border:none; background:red; color:white; padding:5px 15px; border-radius:10px;">ปิด X</button>
        </div>
        <iframe id="web-frame" style="width:100%; height:100%; border:none;"></iframe>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAupdP390vgrb_r1JzMAWbxNCfR3Gf8f-E",
      authDomain: "chineseclass-teacherguan.firebaseapp.com",
      projectId: "chineseclass-teacherguan",
      storageBucket: "chineseclass-teacherguan.appspot.com",
      messagingSenderId: "49788025312",
      appId: "1:49788025312:web:124a9332d523de1f8e137c",
      databaseURL: "https://chineseclass-teacherguan-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let user = { name: "", class: "", coins: 0, pet: "" };
    let curData = {};
    const avatars = ['panda','rabbit','chick','monkey','koala','apple','tangerine','banana','grape','strawberry'];

    // สร้าง Avatar Grid
    const avGrid = document.getElementById('login-av-grid');
    avatars.forEach(a => {
        avGrid.innerHTML += `<div class="av-item" onclick="selAv(this, '${a}')"><img src="https://img.icons8.com/clouds/100/${a}.png"></div>`;
    });

    function selAv(el, type) {
        document.querySelectorAll('.av-item').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected'); user.pet = type;
    }

    // ดึงรายชื่อห้องเรียนจาก DB
    db.ref('settings/rooms').on('value', (s) => {
        const rooms = s.val() ? s.val().split(',') : ['ห้อง A', 'ห้อง B'];
        const select = document.getElementById('u-class-select');
        select.innerHTML = "";
        rooms.forEach(r => { select.innerHTML += `<option value="${r.trim()}">${r.trim()}</option>`; });
        document.getElementById('adm-rooms').value = rooms.join(',');
    });

    function login() {
        user.name = document.getElementById('u-name').value;
        user.class = document.getElementById('u-class-select').value;
        if(!user.name || !user.pet) return alert("กรอกชื่อและเลือกคู่หูจ๊ะ");
        document.getElementById('room-tag').innerText = user.class;
        document.getElementById('board-title').innerText = user.class;
        document.getElementById('nav-bar').style.display = 'grid';
        nav('page-home'); updatePetUI(); sync(); listenBoard();
    }

    function updatePetUI() {
        const img = document.getElementById('pet-img');
        const status = document.getElementById('pet-status');
        const fill = document.getElementById('pet-fill');
        if(user.coins < 50) { img.src="https://img.icons8.com/clouds/200/egg.png"; status.innerText="ร่างไข่"; }
        else { img.src=`https://img.icons8.com/clouds/200/${user.pet}.png`; status.innerText="ร่างตัวน้อย"; }
    }

    function sync() { if(user.name) db.ref(`students/${user.class}/${user.name}`).set(user); }

    function saveAdmin() {
        db.ref('settings/rooms').set(document.getElementById('adm-rooms').value);
        db.ref('master').set({
            word: document.getElementById('adm-word').value,
            cat: document.getElementById('adm-cat').value,
            news: document.getElementById('adm-news').value,
            readLink: document.getElementById('l-r').value,
            listenLink: document.getElementById('l-l').value
        });
        if(document.getElementById('adm-word').value) {
            db.ref('vocab_bank').push({ word: document.getElementById('adm-word').value, cat: document.getElementById('adm-cat').value });
        }
        alert("อัปเดตข้อมูลสำเร็จ!");
    }

    // ฟังก์ชันพื้นฐานอื่นๆ (nav, goLink, closeWeb, listenBoard)
    function nav(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    }
    function goLink(type) {
        const link = curData[type + 'Link'];
        if(link) { document.getElementById('web-overlay').style.display = 'flex'; document.getElementById('web-frame').src = link; }
        else alert("ยังไม่มีลิงก์จ๊ะ");
    }
    function closeWeb() { document.getElementById('web-overlay').style.display = 'none'; user.coins += 10; sync(); updatePetUI(); document.getElementById('score').innerText = user.coins; }
    
    db.ref('master').on('value', (s) => { 
        curData = s.val() || {}; 
        document.getElementById('main-word').innerText = curData.word || "ยินดีต้อนรับ";
        document.getElementById('main-cat').innerText = "หมวด: " + (curData.cat || "ทั่วไป");
        document.getElementById('news-bar').style.display = curData.news ? 'block' : 'none';
        document.getElementById('news-txt').innerText = curData.news || "";
    });

    db.ref('vocab_bank').on('value', (s) => {
        const list = document.getElementById('vocab-list'); list.innerHTML = "";
        const data = s.val(); if(!data) return;
        const cats = {}; Object.values(data).forEach(v => { if(!cats[v.cat]) cats[v.cat] = []; cats[v.cat].push(v.word); });
        for(let c in cats) {
            let sec = `<div style="margin-top:15px;"><b style="color:var(--soft-pink);">📂 ${c}</b><div class="vocab-grid">`;
            cats[c].forEach(w => sec += `<div class="vocab-card"><b>${w}</b></div>`);
            list.innerHTML += sec + `</div></div>`;
        }
    });

    function listenBoard() {
        db.ref(`students/${user.class}`).orderByChild('coins').on('value', (s) => {
            const list = document.getElementById('leaderboard'); list.innerHTML = "";
            let arr = []; s.forEach(c => arr.push(c.val()));
            arr.reverse().forEach((st, i) => {
                list.innerHTML += `<div style="display:flex; align-items:center; background:white; padding:10px; border-radius:15px; margin-bottom:8px;">
                    <b style="width:25px;">${i+1}</b>
                    <img src="https://img.icons8.com/clouds/100/${st.pet}.png" width="35">
                    <div style="flex:1; margin-left:10px;">${st.name}</div><b>${st.coins} 💎</b>
                </div>`;
            });
        });
    }

    let adminC = 0;
    document.body.addEventListener('click', (e) => {
        if(e.clientX > window.innerWidth-60 && e.clientY > window.innerHeight-60) {
            adminC++; if(adminC === 3) { adminC=0; if(prompt("รหัสครู")==="1234") nav('page-admin'); }
        } else adminC = 0;
    });
</script>
</body>
</html>
