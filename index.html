<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Guan - Smart Academy (Detailed Version)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    
    <style>
        /* --- ตั้งค่าสีและตัวแปรหลัก --- */
        :root {
            --color-lime: #DCFD8B;
            --color-peach: #FDD5BD;
            --color-purple: #BC84EE;
            --color-orange: #FF823A;
            --color-bg-light: #f8fafc;
            --color-text-main: #1e293b;
        }

        /* --- การตั้งค่าพื้นฐานของแอป --- */
        * { 
            box-sizing: border-box; 
            font-family: 'Kanit', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            margin: 0; 
            background-color: #cbd5e1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        
        .app-container {
            width: 100%; 
            max-width: 414px; 
            height: 100vh; 
            background-color: var(--color-bg-light);
            position: relative; 
            border-radius: 40px; 
            overflow: hidden; 
            border: 10px solid white;
            box-shadow: 0 40px 80px rgba(0,0,0,0.2);
        }

        /* --- การจัดการหน้าจอ (Pages) --- */
        .page-screen { 
            display: none; 
            flex-direction: column; 
            height: 100%; 
            padding: 20px; 
            overflow-y: auto; 
            padding-bottom: 120px; 
        }
        
        .page-screen.active { 
            display: flex; 
        }

        .card-ui { 
            background: white; 
            border-radius: 25px; 
            padding: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            margin-bottom: 20px; 
        }

        /* --- ระบบ Tamagotchi --- */
        .pet-stage-area {
            background: linear-gradient(180deg, #e0f2fe 0%, #ffffff 100%);
            border-radius: 30px; 
            padding: 30px; 
            text-align: center; 
            position: relative;
            border: 4px solid #bae6fd; 
            margin-bottom: 20px; 
            min-height: 220px;
        }
        
        .pet-image-style { 
            width: 120px; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; 
        }

        .status-bar-container { 
            width: 150px; 
            height: 15px; 
            background: #e2e8f0; 
            border-radius: 20px; 
            margin: 10px auto; 
            overflow: hidden; 
            border: 2px solid white; 
        }
        
        .status-bar-fill-color { 
            height: 100%; 
            background: linear-gradient(90deg, #f87171, #fb923c); 
            width: 0%; 
            transition: width 1.5s ease-in-out; 
        }
        
        .chat-bubble-ui { 
            background: white; 
            padding: 12px 20px; 
            border-radius: 25px; 
            position: absolute;
            top: 20px; 
            right: 20px; 
            font-size: 14px; 
            font-weight: bold; 
            color: var(--color-purple);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); 
            border: 2px solid #f1f5f9;
        }

        /* --- ระบบกระดานเขียนอักษรจีน (Canvas) --- */
        .drawing-board-wrapper {
            position: relative; 
            width: 300px; 
            height: 300px; 
            margin: 15px auto;
            background: #ffffff; 
            border: 6px dashed var(--color-purple); 
            border-radius: 25px;
            overflow: hidden; 
            touch-action: none;
        }
        
        .tracing-hint-text {
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            font-size: 200px; 
            color: #f1f5f9; 
            pointer-events: none; 
            user-select: none;
            font-family: 'serif'; 
            z-index: 1;
        }
        
        #main-drawing-canvas { 
            position: relative; 
            z-index: 2; 
            cursor: crosshair; 
        }

        /* --- ปุ่มกด (Buttons) --- */
        .btn-action {
            border: none; 
            padding: 18px; 
            border-radius: 22px; 
            color: white; 
            font-weight: 600;
            cursor: pointer; 
            font-size: 16px; 
            box-shadow: 0 6px 0 rgba(0,0,0,0.1);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            width: 100%; 
            margin-bottom: 15px;
            transition: all 0.2s;
        }
        
        .btn-action:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }

        /* --- แถบเมนูด้านล่าง (Navbar) --- */
        .bottom-nav-bar {
            background: white; 
            display: grid; 
            grid-template-columns: repeat(4, 1fr);
            padding: 15px 0 35px; 
            position: absolute; 
            bottom: 0; 
            width: 100%;
            border-radius: 35px 35px 0 0; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05); 
            z-index: 100;
        }
        
        .nav-button-item { 
            text-align: center; 
            color: #cbd5e1; 
            cursor: pointer; 
            font-size: 12px; 
        }
        
        .nav-button-item i { 
            font-size: 22px; 
            display: block; 
            margin-bottom: 5px; 
        }
        
        .nav-button-item.active-menu { 
            color: var(--color-purple); 
            font-weight: bold; 
        }

        /* --- ระบบเปิดภารกิจ Wordwall ในหน้าแอป --- */
        #internal-mission-frame {
            display: none; 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: white; 
            z-index: 1000; 
            flex-direction: column;
        }

        input, select {
            width: 100%; 
            padding: 16px; 
            border-radius: 18px; 
            border: 2px solid #f1f5f9;
            margin-bottom: 12px; 
            outline: none; 
            background: #fafafa; 
            font-size: 16px; 
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="internal-mission-frame">
        <div style="padding: 15px; background: white; display: flex; align-items: center; border-bottom: 2px solid #f1f5f9;">
            <button onclick="hideMissionFrame()" style="border:none; background:#fee2e2; color:#ef4444; padding:10px 20px; border-radius:12px; font-weight:bold;">✕ ปิดหน้าภารกิจ</button>
            <span style="margin-left: 20px; font-weight: bold;">ภารกิจพิเศษ</span>
        </div>
        <iframe id="mission-web-view" src="" style="flex-grow: 1; border: none; width: 100%; height: 100%;"></iframe>
    </div>

    <div id="screen-login" class="page-screen active">
        <div style="text-align: center; margin-top: 60px;">
            <i class="fa-solid fa-graduation-cap" style="font-size: 50px; color: var(--color-purple);"></i>
            <h2 style="color:var(--color-orange); margin-top:15px;">Chinese Academy</h2>
        </div>
        <div class="card-ui" style="margin-top:40px;">
            <p style="font-weight:bold; margin-bottom:8px;">ระบุชื่อของนักเรียน:</p>
            <input type="text" id="user-name-input" placeholder="พิมพ์ชื่อเล่นจ๊ะ...">
            <p style="font-weight:bold; margin-bottom:8px;">เลือกระดับชั้น:</p>
            <select id="user-class-select">
                <option>Playgroup (1.5-2.5ปี)</option>
                <option>Playgroup (2.5-4ปี)</option>
                <option>Kids Junior (5-7ปี)</option>
                <option>Kids Senior (8-10ปี)</option>
            </select>
            <button class="btn-action" style="background:var(--color-purple); margin-top:20px;" onclick="processLogin()">เข้าสู่ห้องเรียน ➔</button>
        </div>
    </div>

    <div id="screen-home" class="page-screen">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:20px;">
            <div style="background:white; padding:10px 25px; border-radius:25px; font-weight:bold;">💎 <span id="label-score">0</span></div>
            <div id="label-class" style="background:var(--color-lime); padding:10px 20px; border-radius:20px; font-size:12px; font-weight:bold;">...</div>
        </div>

        <div class="pet-stage-area">
            <div class="chat-bubble-ui" id="pet-text-balloon">你好!</div>
            <img src="https://cdn-icons-png.flaticon.com/512/235/235384.png" class="pet-image-style" id="pet-avatar-click">
            <div class="status-bar-container"><div id="pet-happy-fill" class="status-bar-fill-color"></div></div>
        </div>

        <div class="card-ui" style="text-align: center; border: 2px solid var(--color-purple);">
            <h1 id="label-daily-word" style="font-size: 60px; margin: 0; color:var(--color-text-main);">...</h1>
            <p id="label-daily-cat" style="color:var(--color-orange); font-weight:bold; margin-top:5px;">หมวดหมู่</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <button class="btn-action" onclick="goToGame('read')" style="background:#B3E5FC; color:#01579b;">📖 อ่าน</button>
            <button class="btn-action" onclick="goToGame('listen')" style="background:#C8E6C9; color:#1b5e20;">🎧 ฟัง</button>
            <button class="btn-action" onclick="goToGame('write')" style="background:#FFCC80; color:#e65100;">✍️ เขียน</button>
            <button class="btn-action" onclick="goToGame('speak')" style="background:#F48FB1; color:#880e4f;">🗣️ พูด</button>
        </div>
        
        <button class="btn-action" style="background:var(--color-orange); margin-top:20px; height:70px;" onclick="showMissionFrame()">
            <i class="fa-solid fa-star"></i> ทำภารกิจพิเศษวันนี้
        </button>
    </div>

    <div id="screen-game" class="page-screen">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <button onclick="changePage('screen-home')" style="border:none; background:#f1f5f9; padding:10px 20px; border-radius:15px; font-weight:bold;">ออก</button>
            <b id="game-title-text">กำลังเรียนรู้...</b>
            <div style="width:50px;"></div>
        </div>

        <div id="box-standard-question" class="card-ui" style="text-align:center; margin-top:30px; padding:50px 20px;">
            <h1 id="label-question-display" style="font-size:70px; margin:0;">?</h1>
            <button id="btn-play-audio" style="display:none; margin:25px auto; background:var(--color-purple); color:white; border:none; width:80px; height:80px; border-radius:50%; font-size:30px;">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>

        <div id="box-writing-board" style="display:none; text-align:center;">
            <div class="drawing-board-wrapper">
                <div class="tracing-hint-text" id="label-canvas-hint">字</div>
                <canvas id="main-drawing-canvas" width="300" height="300"></canvas>
            </div>
            <div style="display:flex; gap:15px; margin-top:15px;">
                <button class="btn-action" style="background:#94a3b8;" onclick="clearCanvasBoard()">ลบกระดาน</button>
                <button class="btn-action" style="background:var(--color-purple);" onclick="submitWriting()">ส่งงาน ➔</button>
            </div>
        </div>

        <div id="area-game-choices"></div>
    </div>

    <div id="screen-admin" class="page-screen">
        <h3>⚙️ ตั้งค่าห้องเรียน</h3>
        <div class="card-ui">
            <p style="font-weight:bold; font-size:13px;">1. ชื่อหมวดหมู่:</p>
            <input type="text" id="admin-input-cat">
            <p style="font-weight:bold; font-size:13px;">2. ศัพท์ภาษาจีน:</p>
            <input type="text" id="admin-input-word">
            <p style="font-weight:bold; font-size:13px;">3. คำแปลไทย:</p>
            <input type="text" id="admin-input-mean">
            <p style="font-weight:bold; font-size:13px;">4. ลิงก์ Wordwall (ถ้ามี):</p>
            <input type="text" id="admin-input-link">
            <button class="btn-action" style="background:var(--color-purple);" onclick="sendDataToFirebase()">บันทึกข้อมูล</button>
        </div>
        <div id="admin-vocab-list-area"></div>
    </div>

    <div id="navbar-main-ui" class="bottom-nav-bar" style="display:none;">
        <div class="nav-button-item active-menu" id="menu-home" onclick="changePage('screen-home', this)"><i class="fa-solid fa-house"></i>หน้าแรก</div>
        <div class="nav-button-item" onclick="changePage('screen-admin', this)"><i class="fa-solid fa-gear"></i>คุณครู</div>
    </div>

</div>

<script>
    // --- 1. ตั้งค่า Firebase ---
    const firebaseConfig = {
      apiKey: "AIzaSyAupdP390vgrb_r1JzMAWbxNCfR3Gf8f-E",
      authDomain: "chineseclass-teacherguan.firebaseapp.com",
      projectId: "chineseclass-teacherguan",
      storageBucket: "chineseclass-teacherguan.appspot.com",
      messagingSenderId: "49788025312",
      appId: "1:49788025312:web:124a9332d523de1f8e137c",
      databaseURL: "https://chineseclass-teacherguan-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- 2. ตัวแปรสถานะแอป ---
    let player = { name: "", class: "", coins: 0, link: "" };
    let vocabs = [];
    let currentQuiz = {};
    let currentGameMode = "";

    // --- 3. ระบบกระดานเขียนแบบละเอียด (Drawing Logic) ---
    const canvas = document.getElementById('main-drawing-canvas');
    const context = canvas.getContext('2d');
    let drawingActive = false;

    // ฟังก์ชันเริ่มวาด
    function startDrawing(e) {
        drawingActive = true;
        const pos = getPosition(e);
        context.beginPath();
        context.moveTo(pos.x, pos.y);
    }

    // ฟังก์ชันวาดเส้น
    function drawLine(e) {
        if (drawingActive == false) return;
        const pos = getPosition(e);
        context.lineTo(pos.x, pos.y);
        context.strokeStyle = "#475569";
        context.lineWidth = 15;
        context.lineCap = "round";
        context.stroke();
    }

    // ฟังก์ชันหยุดวาด
    function stopDrawing() {
        drawingActive = false;
    }

    // คำนวณตำแหน่ง
    function getPosition(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX || e.touches[0].clientX) - rect.left;
        const y = (e.clientY || e.touches[0].clientY) - rect.top;
        return { x: x, y: y };
    }

    function clearCanvasBoard() {
        context.clearRect(0, 0, canvas.width, canvas.height);
    }

    // เชื่อมต่อ Event ให้กับกระดาน
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', drawLine);
    window.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', drawLine);
    canvas.addEventListener('touchend', stopDrawing);

    // --- 4. การทำงานของระบบล็อกอิน ---
    function processLogin() {
        const name = document.getElementById('user-name-input').value.trim();
        const uClass = document.getElementById('user-class-select').value;
        
        if (name == "") {
            alert("ใส่ชื่อเล่นก่อนจ้า");
            return;
        }

        player.name = name;
        player.class = uClass;

        document.getElementById('navbar-main-ui').style.display = 'grid';
        document.getElementById('label-class').innerText = uClass;
        
        changePage('screen-home');
        syncCloudData();
    }

    // ดึงข้อมูลจาก Cloud ตลอดเวลา
    function syncCloudData() {
        // ดึงศัพท์ประจำวัน
        db.ref('master').on('value', (s) => {
            const data = s.val() || {};
            document.getElementById('label-daily-word').innerText = data.word || "你好";
            document.getElementById('label-daily-cat').innerText = data.cat || "คำศัพท์";
            player.link = data.link;
        });

        // ดึงคลังศัพท์
        db.ref('vocab_bank').on('value', (s) => {
            vocabs = [];
            const list = document.getElementById('admin-vocab-list-area');
            list.innerHTML = "";
            s.forEach((child) => {
                const v = child.val();
                vocabs.push(v);
                list.innerHTML += `<div style="background:#eee; padding:10px; margin-top:5px; border-radius:10px;">${v.word} = ${v.mean}</div>`;
            });
        });

        // ดึงคะแนนนักเรียน
        db.ref('users/' + player.name).on('value', (s) => {
            if (s.exists()) {
                player.coins = s.val().coins;
                document.getElementById('label-score').innerText = player.coins;
                document.getElementById('pet-happy-fill').style.width = (player.coins % 100) + "%";
            } else {
                db.ref('users/' + player.name).set({ coins: 0, class: player.class });
            }
        });
    }

    // --- 5. ระบบเกมและการเรียนรู้ ---
    function goToGame(mode) {
        if (vocabs.length < 3) {
            alert("เพิ่มคำศัพท์ก่อนนะจ๊ะ");
            return;
        }
        currentGameMode = mode;
        changePage('screen-game');
        document.getElementById('game-title-text').innerText = "โหมด " + mode.toUpperCase();
        nextQuiz();
    }

    function nextQuiz() {
        currentQuiz = vocabs[Math.floor(Math.random() * vocabs.length)];
        
        const qLabel = document.getElementById('label-question-display');
        const audioBtn = document.getElementById('btn-play-audio');
        const choicesArea = document.getElementById('area-game-choices');
        const writeBox = document.getElementById('box-writing-board');
        const qBox = document.getElementById('box-standard-question');

        choicesArea.innerHTML = "";
        audioBtn.style.display = "none";
        writeBox.style.display = "none";
        qBox.style.display = "block";

        if (currentGameMode == 'read') {
            qLabel.innerText = currentQuiz.word;
            renderOptions();
        } 
        else if (currentGameMode == 'listen') {
            qLabel.innerText = "👂";
            audioBtn.style.display = "block";
            audioBtn.onclick = () => speak(currentQuiz.word);
            speak(currentQuiz.word);
            renderOptions();
        } 
        else if (currentGameMode == 'write') {
            qBox.style.display = "none";
            writeBox.style.display = "block";
            document.getElementById('label-canvas-hint').innerText = currentQuiz.word;
            clearCanvasBoard();
        }
        else if (currentGameMode == 'speak') {
            qLabel.innerText = currentQuiz.word;
            choicesArea.innerHTML = `<button class="btn-action" style="background:var(--color-orange);" onclick="startRec()">🎙️ กดเพื่อพูด</button>`;
        }
    }

    function renderOptions() {
        let opts = [currentQuiz.mean];
        while(opts.length < 3) {
            let r = vocabs[Math.floor(Math.random()*vocabs.length)].mean;
            if(!opts.includes(r)) opts.push(r);
        }
        opts.sort(() => Math.random() - 0.5);
        opts.forEach(o => {
            const b = document.createElement('button');
            b.className = "btn-action";
            b.style.background = "white";
            b.style.color = "#333";
            b.innerText = o;
            b.onclick = () => check(o);
            document.getElementById('area-game-choices').appendChild(b);
        });
    }

    function submitWriting() { check(currentQuiz.mean); }

    function check(ans) {
        if (ans == currentQuiz.mean) {
            player.coins += 10;
            db.ref('users/' + player.name).update({ coins: player.coins });
            alert("เก่งมาก! +10 💎");
            nextQuiz();
        } else {
            alert("ลองใหม่นะจ๊ะ");
        }
    }

    function speak(txt) {
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'zh-CN';
        window.speechSynthesis.speak(u);
    }

    function startRec() {
        const r = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        r.lang = 'zh-CN';
        r.start();
        r.onresult = (e) => {
            if(e.results[0][0].transcript.includes(currentQuiz.word)) check(currentQuiz.mean);
            else alert("พูดว่าอะไรนะจ๊ะ? ลองใหม่นะ");
        };
    }

    // --- 6. ฟังก์ชันควบคุมหน้าจอ (Navigation) ---
    function changePage(id, el) {
        const screens = document.querySelectorAll('.page-screen');
        for(let i=0; i<screens.length; i++) {
            screens[i].classList.remove('active');
        }
        document.getElementById(id).classList.add('active');

        if (el) {
            const items = document.querySelectorAll('.nav-button-item');
            for(let j=0; j<items.length; j++) {
                items[j].classList.remove('active-menu');
            }
            el.classList.add('active-menu');
        }
    }

    function showMissionFrame() {
        if(!player.link) return alert("ไม่มีภารกิจจ้า");
        document.getElementById('mission-web-view').src = player.link;
        document.getElementById('internal-mission-frame').style.display = 'flex';
    }
    
    function hideMissionFrame() {
        document.getElementById('internal-mission-frame').style.display = 'none';
        document.getElementById('mission-web-view').src = "";
    }

    // --- 7. ระบบบันทึกข้อมูลแอดมิน ---
    function sendDataToFirebase() {
        const cat = document.getElementById('admin-input-cat').value;
        const word = document.getElementById('admin-input-word').value;
        const mean = document.getElementById('admin-input-mean').value;
        const link = document.getElementById('admin-input-link').value;

        db.ref('vocab_bank').push({ word: word, mean: mean, cat: cat });
        db.ref('master').update({ word: word, cat: cat, link: link });

        alert("บันทึกแล้วจ้า!");
        document.getElementById('admin-input-word').value = "";
        document.getElementById('admin-input-mean').value = "";
    }

    // คลิกน้องแพนด้าให้พูด
    document.getElementById('pet-avatar-click').onclick = () => {
        speak(document.getElementById('pet-text-balloon').innerText);
    };
