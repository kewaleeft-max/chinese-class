<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher Guan - Chinese Tamagotchi Academy</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    
    <style>
        :root {
            --lime: #DCFD8B; --peach: #FDD5BD; --purple: #BC84EE; --orange: #FF823A;
            --soft-white: #f8fafc; --text-dark: #1e293b; --shadow: rgba(0, 0, 0, 0.08);
        }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .app-container {
            width: 100%; max-width: 414px; height: 100vh; background-color: var(--soft-white);
            position: relative; border-radius: 40px; overflow: hidden; border: 8px solid white;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        .page { display: none; flex-direction: column; height: 100%; padding: 20px; overflow-y: auto; padding-bottom: 120px; }
        .page.active { display: flex; }
        .card { background: white; border-radius: 25px; padding: 20px; box-shadow: 0 8px 20px var(--shadow); margin-bottom: 15px; }

        /* Tamagotchi Visuals */
        .pet-stage {
            background: linear-gradient(to bottom, #e0f2fe 0%, #ffffff 100%);
            border-radius: 30px; padding: 25px; text-align: center; position: relative;
            border: 3px solid #bae6fd; margin-bottom: 15px; min-height: 220px;
        }
        .pet-img { width: 110px; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; }
        .pet-img:active { transform: scale(1.3) rotate(5deg); }
        .status-bar-container { width: 140px; height: 12px; background: #e2e8f0; border-radius: 10px; margin: 8px auto; overflow: hidden; border: 2px solid white; }
        .status-fill { height: 100%; background: linear-gradient(90deg, #f87171, #fb923c); width: 0%; transition: width 1s; }
        .bubble { 
            background: white; padding: 10px 18px; border-radius: 20px; position: absolute;
            top: 15px; right: 15px; font-size: 13px; font-weight: bold; color: var(--purple);
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
        }

        /* Writing Canvas */
        #writing-canvas-container {
            position: relative; width: 280px; height: 280px; margin: 10px auto;
            background: #fff; border: 4px dashed var(--purple); border-radius: 20px;
            touch-action: none; overflow: hidden;
        }
        #canvas-hint-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 180px; color: #f1f5f9; pointer-events: none; user-select: none;
            font-family: 'serif';
        }
        #writing-canvas { display: block; cursor: crosshair; }

        /* Navigation & UI */
        .btn-skill {
            border: none; padding: 15px; border-radius: 20px; color: white; font-weight: 600;
            cursor: pointer; font-size: 16px; box-shadow: 0 5px 0 rgba(0,0,0,0.1);
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-bottom: 12px;
        }
        .btn-skill:active { transform: translateY(4px); box-shadow: none; }

        .nav-bar {
            background: white; display: grid; grid-template-columns: repeat(4, 1fr);
            padding: 10px 0 30px; position: absolute; bottom: 0; width: 100%;
            border-radius: 30px 30px 0 0; box-shadow: 0 -5px 20px var(--shadow); z-index: 100;
        }
        .nav-item { text-align: center; color: #cbd5e1; cursor: pointer; font-size: 11px; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }
        .nav-item.active { color: var(--purple); font-weight: bold; }

        input, select {
            width: 100%; padding: 14px; border-radius: 15px; border: 2px solid #f1f5f9;
            margin-bottom: 10px; outline: none; background: #fafafa; font-size: 16px;
        }

        /* Iframe for External Link */
        #iframe-wrapper {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 1000; flex-direction: column;
        }
        #external-iframe { flex-grow: 1; border: none; width: 100%; height: 100%; }

        .cat-group { margin-bottom: 25px; border-left: 6px solid var(--purple); padding-left: 15px; }
        .vocab-item { display: flex; justify-content: space-between; background: #f8fafc; padding: 12px 15px; border-radius: 12px; margin-bottom: 8px; font-size: 14px; border: 1px solid #edf2f7; }
    </style>
</head>
<body>

<div class="app-container">
    
    <div id="iframe-wrapper">
        <div style="padding: 15px; background: #fff; display: flex; align-items: center; border-bottom: 1px solid #eee;">
            <button onclick="closeIframe()" style="border:none; background:#f1f5f9; padding:8px 15px; border-radius:10px; font-weight:bold;">✕ ปิดกิจกรรม</button>
            <span style="margin-left: 15px; font-weight: bold; color: var(--purple);">ห้องเรียน Teacher Guan</span>
        </div>
        <iframe id="external-iframe" src=""></iframe>
    </div>

    <div id="page-login" class="page active">
        <h2 style="text-align:center; color:var(--orange); font-family:'Comfortaa'; margin-top:50px;">Teacher Guan 🐼</h2>
        <div class="card" style="margin-top:30px;">
            <label style="font-weight:bold; font-size:13px; color:#64748b;">ชื่อเล่น:</label>
            <input type="text" id="u-name" placeholder="ชื่ออะไรจ๊ะ...">
            <label style="font-weight:bold; font-size:13px; color:#64748b;">ห้องเรียน:</label>
            <select id="u-class">
                <option>Playgroup (1.5-2.5ปี)</option>
                <option>Playgroup (2.5-4ปี)</option>
                <option>Kids Junior (5-7ปี)</option>
                <option>Kids Senior (8-10ปี)</option>
            </select>
            <button class="btn-skill" style="background:var(--purple); margin-top:15px;" onclick="login()">เริ่มต้นเลย! ➔</button>
        </div>
    </div>

    <div id="page-home" class="page">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:15px;">
            <div style="background:white; padding:8px 20px; border-radius:20px; font-weight:bold; box-shadow: 0 4px 12px var(--shadow);">💎 <span id="score">0</span></div>
            <div id="disp-class" style="background:var(--lime); padding:8px 15px; border-radius:15px; font-size:11px; font-weight:bold; color:#3f6212;">...</div>
        </div>

        <div class="pet-stage">
            <div class="bubble" id="pet-talk">你好!</div>
            <img src="https://cdn-icons-png.flaticon.com/512/235/235384.png" class="pet-img" onclick="petSpeak()">
            <div class="status-bar-container"><div id="pet-happy-bar" class="status-fill"></div></div>
        </div>

        <div class="card" style="text-align: center;">
            <h1 id="main-word" style="font-size: 55px; margin: 5px 0; color:var(--text-dark);">...</h1>
            <span id="main-cat" style="color:var(--orange); font-size:14px; font-weight:bold;">หมวดหมู่</span>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <button class="btn-skill" onclick="startPlay('read')" style="background:#B3E5FC; color:#01579b;">📖 อ่าน</button>
            <button class="btn-skill" onclick="startPlay('listen')" style="background:#C8E6C9; color:#1b5e20;">🎧 ฟัง</button>
            <button class="btn-skill" onclick="startPlay('write')" style="background:#FFCC80; color:#e65100;">✍️ เขียน</button>
            <button class="btn-skill" onclick="startPlay('speak')" style="background:#F48FB1; color:#880e4f;">🗣️ พูด</button>
        </div>
        
        <button class="btn-skill" style="background:var(--orange); margin-top:15px; height:60px;" onclick="openIframe()">
            <i class="fa-solid fa-star"></i> ตะลุยภารกิจพิเศษ
        </button>
    </div>

    <div id="page-game" class="page">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <button onclick="nav('page-home')" style="border:none; background:#eee; padding:8px 15px; border-radius:10px;">ออก</button>
            <b id="game-title" style="color:var(--purple);">GAME</b>
            <span></span>
        </div>

        <div id="standard-q-card" class="card" style="text-align:center; margin-top:20px; padding:40px 10px;">
            <h1 id="q-text" style="font-size:60px; margin:0;">?</h1>
            <button id="q-audio" onclick="playCurrentWord()" style="display:none; margin:20px auto; background:var(--purple); color:white; border:none; width:70px; height:70px; border-radius:50%; font-size:25px;">
                <i class="fa-solid fa-volume-high"></i>
            </button>
        </div>

        <div id="writing-area" style="display:none; text-align:center;">
            <div id="writing-canvas-container">
                <div id="canvas-hint-text">字</div>
                <canvas id="writing-canvas" width="280" height="280"></canvas>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn-skill" style="background:#94a3b8;" onclick="clearCanvas()">ลบกระดาน</button>
                <button class="btn-skill" style="background:var(--purple);" onclick="checkWriting()">ส่งงาน ➔</button>
            </div>
        </div>

        <div id="game-options-area"></div>
    </div>

    <div id="page-admin" class="page">
        <h3>⚙️ จัดการคำศัพท์</h3>
        <div class="card">
            <label>📂 หมวดหมู่:</label><input type="text" id="adm-cat">
            <label>🏮 ศัพท์จีน:</label><input type="text" id="adm-word">
            <label>📖 คำแปล:</label><input type="text" id="adm-mean">
            <label>🔗 ลิงก์เสริม:</label><input type="text" id="adm-link">
            <button class="btn-skill" style="background:var(--purple);" onclick="saveAdmin()">บันทึกข้อมูล</button>
        </div>
        <div id="adm-vocab-display"></div>
    </div>

    <div id="page-rank" class="page">
        <h3 style="text-align:center;">🏆 อันดับคนเก่ง</h3>
        <div id="rank-content" class="card"></div>
    </div>

    <div id="nav-bar" class="nav-bar" style="display:none;">
        <div class="nav-item active" onclick="nav('page-home', this)"><i class="fa-solid fa-paw"></i>หน้าแรก</div>
        <div class="nav-item" onclick="loadRank(this)"><i class="fa-solid fa-trophy"></i>อันดับ</div>
        <div class="nav-item" onclick="nav('page-admin', this)"><i class="fa-solid fa-gear"></i>คุณครู</div>
    </div>

</div>

<script>
    // 1. Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyAupdP390vgrb_r1JzMAWbxNCfR3Gf8f-E",
      authDomain: "chineseclass-teacherguan.firebaseapp.com",
      projectId: "chineseclass-teacherguan",
      storageBucket: "chineseclass-teacherguan.appspot.com",
      messagingSenderId: "49788025312",
      appId: "1:49788025312:web:124a9332d523de1f8e137c",
      databaseURL: "https://chineseclass-teacherguan-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. Global Variables
    let user = { name: "", class: "", coins: 0, link: "" };
    let vocabs = [];
    let curQ = {};
    let curMode = "";

    // 3. Canvas Logic
    const canvas = document.getElementById('writing-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function initCanvas() {
        ctx.strokeStyle = "#475569"; ctx.lineWidth = 15; ctx.lineCap = "round";
        const getXY = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        };
        const start = (e) => { isDrawing = true; const p = getXY(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
        const move = (e) => { if(!isDrawing) return; const p = getXY(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        const stop = () => isDrawing = false;

        canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', stop);
        canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', stop);
    }

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // 4. App Core Logic
    function login() {
        const name = document.getElementById('u-name').value.trim();
        if(!name) return alert("ใส่ชื่อก่อนนะจ๊ะ");
        user.name = name; user.class = document.getElementById('u-class').value;
        document.getElementById('nav-bar').style.display = 'grid';
        document.getElementById('disp-class').innerText = user.class;
        nav('page-home');
        syncData();
        initCanvas();
    }

    function syncData() {
        db.ref('master').on('value', s => {
            const d = s.val() || {};
            document.getElementById('main-word').innerText = d.word || "你好";
            document.getElementById('main-cat').innerText = d.cat || "คำศัพท์";
            user.link = d.link;
            document.getElementById('adm-cat').value = d.cat || "";
            document.getElementById('adm-link').value = d.link || "";
        });

        db.ref('vocab_bank').on('value', s => {
            vocabs = [];
            const area = document.getElementById('adm-vocab-display'); area.innerHTML = "";
            let groups = {};
            s.forEach(c => {
                const v = c.val(); vocabs.push(v);
                if(!groups[v.cat]) groups[v.cat] = [];
                groups[v.cat].push(v);
            });
            for(let g in groups) {
                let h = `<div class="cat-group"><b>${g}</b>`;
                groups[g].forEach(i => h += `<div class="vocab-item">${i.word} ➔ ${i.mean}</div>`);
                area.innerHTML += h + `</div>`;
            }
        });

        db.ref('users/' + user.name).on('value', s => {
            if(s.exists()) {
                user.coins = s.val().coins;
                document.getElementById('score').innerText = user.coins;
                document.getElementById('pet-happy-bar').style.width = (user.coins % 100) + "%";
            } else db.ref('users/' + user.name).set({ coins: 0, class: user.class });
        });
    }

    function openIframe() {
        if(!user.link) return alert("คุณครูยังไม่ได้แปะลิงก์จ้า");
        document.getElementById('external-iframe').src = user.link;
        document.getElementById('iframe-wrapper').style.display = 'flex';
    }
    function closeIframe() { 
        document.getElementById('iframe-wrapper').style.display = 'none';
        document.getElementById('external-iframe').src = "";
    }

    function startPlay(m) {
        if(vocabs.length < 3) return alert("เพิ่มศัพท์ก่อนนะจ๊ะ");
        curMode = m; nav('page-game');
        document.getElementById('game-title').innerText = "โหมด " + m.toUpperCase();
        nextQuestion();
    }

    function nextQuestion() {
        curQ = vocabs[Math.floor(Math.random() * vocabs.length)];
        const area = document.getElementById('game-options-area'), qT = document.getElementById('q-text'), 
              aud = document.getElementById('q-audio'), wArea = document.getElementById('writing-area'),
              qCard = document.getElementById('standard-q-card');
        
        area.innerHTML = ""; aud.style.display = "none"; wArea.style.display = "none"; qCard.style.display = "block";

        if(curMode == 'read') { qT.innerText = curQ.word; renderChoices(); }
        else if(curMode == 'listen') { qT.innerText = "👂"; aud.style.display = "block"; playCurrentWord(); renderChoices(); }
        else if(curMode == 'write') {
            qCard.style.display = "none"; wArea.style.display = "block";
            document.getElementById('canvas-hint-text').innerText = curQ.word;
            clearCanvas();
        }
        else if(curMode == 'speak') { qT.innerText = curQ.word; area.innerHTML = `<button class="btn-skill" style="background:var(--orange);" onclick="startRec()">🎙️ กดแล้วพูดเลย</button>`; }
    }

    function renderChoices() {
        let opts = [curQ.mean];
        while(opts.length < 3) {
            let r = vocabs[Math.floor(Math.random()*vocabs.length)].mean;
            if(!opts.includes(r)) opts.push(r);
        }
        opts.sort(()=>Math.random()-0.5).forEach(o => {
            const b = document.createElement('div'); b.className = "btn-skill"; b.style.background = "white"; b.style.color = "#333";
            b.innerText = o; b.onclick = () => checkAns(o); document.getElementById('game-options-area').appendChild(b);
        });
    }

    function checkWriting() { checkAns(curQ.mean); }

    function checkAns(a) {
        if(a == curQ.mean) {
            user.coins += 10; db.ref('users/'+user.name).update({coins:user.coins});
            alert("เก่งมาก! +10 💎"); nextQuestion();
        } else alert("ลองใหม่นะจ๊ะ");
    }

    function playCurrentWord() { const u = new SpeechSynthesisUtterance(curQ.word); u.lang='zh-CN'; window.speechSynthesis.speak(u); }
    function startRec() {
        const r = new (window.SpeechRecognition || window.webkitSpeechRecognition)(); r.lang='zh-CN'; r.start();
        r.onresult = (e) => { if(e.results[0][0].transcript.includes(curQ.word)) checkAns(curQ.mean); else alert("ลองใหม่นะ"); }
    }

    function saveAdmin() {
        const c = document.getElementById('adm-cat').value, w = document.getElementById('adm-word').value,
              m = document.getElementById('adm-mean').value, l = document.getElementById('adm-link').value;
        if(!c || !w || !m) return alert("กรอกให้ครบจ้า");
        db.ref('master').update({ word: w, cat: c, link: l });
        db.ref('vocab_bank').push({ word: w, mean: m, cat: c });
        alert("✅ บันทึกแล้ว! เพิ่มคำต่อไปได้เลย");
        document.getElementById('adm-word').value = ""; document.getElementById('adm-mean').value = "";
    }

    function nav(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    }

    function loadRank(el) {
        nav('page-rank', el);
        db.ref('users').orderByChild('coins').limitToLast(10).once('value', s => {
            let h = ""; let arr = []; s.forEach(c => arr.push({n: c.key, ...c.val()}));
            arr.reverse().forEach((u, i) => h += `<div style="display:flex; justify-content:space-between; padding:12px; border-bottom:1px solid #eee;"><span>${i+1}. ${u.n}</span><b>💎 ${u.coins}</b></div>`);
            document.getElementById('rank-content').innerHTML = h || "ยังไม่มีข้อมูล";
        });
    }

    function petSpeak() { const u = new SpeechSynthesisUtterance(document.getElementById('pet-talk').innerText); u.lang='zh-CN'; window.speechSynthesis.speak(u); }
</script>
</body>
</html>
