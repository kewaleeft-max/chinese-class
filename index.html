<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chinese Class - stroke master</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>
    <style>
        :root { --bg-cream: #FFFDE7; --soft-pink: #FFC1CC; --sky-blue: #B3E5FC; --mint: #C8E6C9; --white: #ffffff; }
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; touch-action: manipulation; }
        body { margin: 0; background-color: #fcfcfc; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 400px; height: 100vh; max-height: 850px; background-color: var(--bg-cream); position: relative; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.1); border-radius: 35px; overflow: hidden; border: 8px solid white; }
        .page { display: none; flex-direction: column; height: 100%; padding: 25px; overflow-y: auto; padding-bottom: 120px; }
        .page.active { display: flex; }
        .card { background: var(--white); border-radius: 30px; padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); margin-bottom: 15px; text-align: center; }
        .btn-primary { background: var(--soft-pink); color: white; border: none; padding: 16px; border-radius: 20px; cursor: pointer; width: 100%; font-weight: 600; box-shadow: 0 5px 0 #efabb7; font-size: 18px; margin-top: 10px; }
        .btn-primary:active { transform: translateY(4px); box-shadow: none; }
        input { width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #f0f0f0; margin-bottom: 15px; text-align: center; }
        .nav-bar { background: white; display: grid; grid-template-columns: repeat(3, 1fr); padding: 15px 0 35px; position: absolute; bottom: 0; width: 100%; border-radius: 35px 35px 0 0; z-index: 10; }
        .nav-item { text-align: center; color: #ddd; cursor: pointer; font-size: 12px; }
        .nav-item.active { color: var(--soft-pink); font-weight: bold; }
        
        /* กระดานเขียน */
        #draw-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; flex-direction: column; align-items: center; padding: 20px; }
        #canvas-board { background: #fafafa; border: 4px dashed var(--soft-pink); border-radius: 20px; touch-action: none; margin-top: 10px; }
        .avatar-item { width: 100%; aspect-ratio: 1/1; border-radius: 20px; border: 4px solid transparent; cursor: pointer; }
        .avatar-item.selected { border-color: var(--soft-pink); transform: scale(1.1); }
    </style>
</head>
<body>

<div class="app-container">
    <div id="page-login" class="page active">
        <h2 style="text-align: center; color: var(--soft-pink);">ห้องเรียน关老师</h2>
        <div class="card">
            <input type="text" id="user-name" placeholder="ชื่อเล่นของหนู...">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0;">
                <img src="https://img.icons8.com/clouds/200/panda.png" class="avatar-item" onclick="pickAvatar(this)">
                <img src="https://img.icons8.com/clouds/200/rabbit.png" class="avatar-item" onclick="pickAvatar(this)">
                <img src="https://img.icons8.com/clouds/200/chick.png" class="avatar-item" onclick="pickAvatar(this)">
            </div>
            <button class="btn-primary" onclick="doLogin()">เข้าเรียนจ๊ะ ➔</button>
        </div>
    </div>

    <div id="page-home" class="page">
        <div style="display:flex; justify-content: space-between;">
            <span style="font-weight: bold;">💎 <span id="coins">0</span></span>
            <span id="lesson-title" style="background: var(--mint); padding: 5px 12px; border-radius: 20px; color:#4caf50; font-size:12px;">...</span>
        </div>
        <div class="card" style="margin-top:20px;">
            <img id="user-mascot" src="" width="100" style="margin: 10px 0;">
            <div id="lesson-content" style="font-size: 36px; font-weight:bold; color: #444;">...</div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <button class="btn-primary" onclick="getPoints(10)" style="background:var(--sky-blue); box-shadow: 0 5px 0 #81d4fa;">📖 อ่าน</button>
            <button class="btn-primary" onclick="getPoints(10)" style="background:var(--mint); box-shadow: 0 5px 0 #a5d6a7;">🎧 ฟัง</button>
            <button class="btn-primary" onclick="startAI()" style="background:#fff176; color:#5d4037; box-shadow: 0 5px 0 #fdd835;">🗣️ พูด</button>
            <button class="btn-primary" onclick="openDrawing()" style="background:var(--soft-pink); box-shadow: 0 5px 0 #efabb7;">✍️ เขียนตาม</button>
        </div>
    </div>

    <div id="draw-modal">
        <div style="text-align: center;">
            <h3 style="color: var(--soft-pink); margin: 0;">เขียนตามลำดับขีดนะจ๊ะ</h3>
            <p style="font-size: 12px; color: #999;">ดูรูปข้างล่างแล้วลากเส้นตามเลย</p>
            <img id="stroke-guide" src="" style="height: 120px; border-radius: 10px; border: 2px solid #eee; background: white;">
        </div>
        <canvas id="canvas-board"></canvas>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; margin-top: 20px;">
            <button class="btn-primary" onclick="clearCanvas()" style="background:#bbb; box-shadow: 0 5px 0 #999;">ลบเขียนใหม่</button>
            <button class="btn-primary" onclick="closeDrawing()">ส่งงานจ๊ะ ✨</button>
        </div>
    </div>

    <div id="page-admin" class="page">
        <h3>ตั้งค่าบทเรียน</h3>
        <div class="card">
            <input type="text" id="edit-title" placeholder="ชื่อบท">
            <input type="text" id="edit-words" placeholder="คำศัพท์จีน">
            <input type="text" id="edit-stroke" placeholder="ลิงก์รูปภาพลำดับขีด (GIF จะดีมาก)">
            <button class="btn-primary" onclick="updateLesson()">บันทึก</button>
        </div>
        <button class="btn-primary" onclick="navTo('page-home')" style="background:gray;">กลับ</button>
    </div>

    <div class="nav-bar" id="main-nav" style="display:none;">
        <div class="nav-item active" onclick="navTo('page-home', this)">🏠<br>หน้าหลัก</div>
        <div class="nav-item" style="opacity:0.3">📚<br>บทเรียน</div>
        <div class="nav-item" onclick="checkAdmin(this)">⚙️<br>จัดการ</div>
    </div>
</div>

<script>
    // Firebase & Global Vars
    const firebaseConfig = {
      apiKey: "AIzaSyAupdP390vgrb_r1JzMAWbxNCfR3Gf8f-E",
      authDomain: "chineseclass-teacherguan.firebaseapp.com",
      projectId: "chineseclass-teacherguan",
      storageBucket: "chineseclass-teacherguan.appspot.com",
      messagingSenderId: "49788025312",
      appId: "1:49788025312:web:124a9332d523de1f8e137c",
      databaseURL: "https://chineseclass-teacherguan-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let user = { name: "", coins: 0, avatar: "" };
    let currentWord = "", currentStroke = "";

    // กระดานวาดรูป
    const canvas = document.getElementById('canvas-board');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    function openDrawing() {
        document.getElementById('draw-modal').style.display = 'flex';
        document.getElementById('stroke-guide').src = currentStroke;
        canvas.width = 320; canvas.height = 320;
        ctx.strokeStyle = "#444"; ctx.lineWidth = 8; ctx.lineCap = "round";
        clearCanvas();
    }

    function closeDrawing() {
        document.getElementById('draw-modal').style.display = 'none';
        getPoints(20); alert("คุณครูตรวจแล้ว ให้คะแนนเต็มเลยจ๊ะ! 💎+20");
    }

    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

    // Touch Support
    canvas.addEventListener('touchstart', (e) => { isDrawing = true; const t = e.touches[0]; draw(t.clientX, t.clientY, false); });
    canvas.addEventListener('touchmove', (e) => { if(!isDrawing) return; const t = e.touches[0]; draw(t.clientX, t.clientY, true); e.preventDefault(); });
    canvas.addEventListener('touchend', () => isDrawing = false);

    function draw(x, y, cont) {
        const r = canvas.getBoundingClientRect();
        const cx = x - r.left; const cy = y - r.top;
        if(!cont) { ctx.beginPath(); ctx.moveTo(cx, cy); }
        else { ctx.lineTo(cx, cy); ctx.stroke(); }
    }

    // AI Voice & Other
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'zh-CN';
    recognition.onresult = (e) => {
        if (e.results[0][0].transcript.includes(currentWord)) { alert("ชัดเจนจ๊ะ! 💎+10"); getPoints(10); }
    };
    function startAI() { recognition.start(); }

    db.ref('lesson').on('value', (s) => {
        const d = s.val() || { title: "บทเรียน", words: "你好", stroke: "" };
        document.getElementById('lesson-title').innerText = d.title;
        document.getElementById('lesson-content').innerText = d.words;
        currentWord = d.words; currentStroke = d.stroke;
    });

    function pickAvatar(img) {
        document.querySelectorAll('.avatar-item').forEach(i => i.classList.remove('selected'));
        img.classList.add('selected'); user.avatar = img.src;
    }

    function doLogin() {
        const n = document.getElementById('user-name').value;
        if(!n || !user.avatar) return alert("กรุณาใส่ชื่อและเลือกตัวละครจ๊ะ");
        user.name = n; document.getElementById('user-mascot').src = user.avatar;
        document.getElementById('main-nav').style.display = 'grid';
        navTo('page-home'); sync();
    }

    function getPoints(pts) { user.coins += pts; document.getElementById('coins').innerText = user.coins; sync(); }
    function sync() { if(user.name) db.ref('students/' + user.name).update(user); }
    function updateLesson() {
        db.ref('lesson').set({
            title: document.getElementById('edit-title').value,
            words: document.getElementById('edit-words').value,
            stroke: document.getElementById('edit-stroke').value
        });
        alert("บันทึกแล้วจ๊ะ");
    }

    function checkAdmin(el) {
        if(prompt("รหัสครู:") === "1234") navTo('page-admin', el);
    }

    function navTo(id, el) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(el) { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    }
</script>
</body>
</html>
